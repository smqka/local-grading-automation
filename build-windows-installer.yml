name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'grading_api/**'
      - 'server/**'
      - 'web/**'
      - 'tests/**'
      - 'package.json'
      - 'packaging/windows/**'
      - '.github/workflows/build-windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install 'pyinstaller>=6.10,<7'
      - name: Run project checks
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Node syntax checks failed' }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build standalone application and setup
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Smoke-test bundled services
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AI阅卷助手-Windows-x64-Setup
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30
